# Publishes @xmlvalid/cli to npm, with provenance, when a vX.Y.Z tag is pushed.
#
# One-time setup, with Trusted Publishing (no token stored anywhere):
#   npmjs.com → @xmlvalid/cli → Settings → Trusted Publisher → GitHub Actions:
#     Organization or user: xmlvalid    Repository: cli
#     Workflow filename: publish.yml    Environment: (empty)
#     Permissions: npm stage publish
# A run stages the version; it goes live once approved with 2FA on npmjs.com (the package's
# staged versions) or with `npm stage approve <stage-id>`. `npm stage` needs npm 12.
#
# Releasing: bump "version" in package.json and VERSION in bin/xmlvalid.mjs, commit, then
#   git tag v1.0.2 && git push origin v1.0.2
# The same tag is what pre-commit users pin (rev: v1.0.2).

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag matches the version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
          grep -q "VERSION = '$(node -p 'require("./package.json").version')'" bin/xmlvalid.mjs
      - run: npm test
      - run: npx -y npm@12.2.0 stage publish --provenance --access public
